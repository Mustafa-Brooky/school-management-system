<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | School Management System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="dashboard" data-protected="true">
  <!-- ================================
  EPIC 1: UI & Layout
  TASK 1.1: Create full responsive layout
  TASK 1.2: Create sidebar navigation
  TASK 1.3: Create top navbar
  ================================ -->
  <div class="layout">
    <aside id="sidebar"></aside>
    <div class="main-wrapper">
      <header id="topbar"></header>
      
      <!-- ================================
      EPIC 8: Dashboard & Reports
      TASK 8.1: Show total counters
      TASK 8.5: Show recent activity
      TASK 8.6: Show top students
      TASK 8.7: Show failing students
      ================================ -->
      <main class="content">
        <h1>Dashboard</h1>
        <div id="page-alert"></div>

        <section class="stats-grid" id="stats-grid"></section>

        <section class="dashboard-grid">
          <article class="panel">
            <h2>Recent Activity</h2>
            <ul id="recent-activity" class="list"></ul>
          </article>

          <article class="panel">
            <h2>Top Students</h2>
            <ul id="top-students" class="list"></ul>
          </article>

          <article class="panel">
            <h2>Failing Students</h2>
            <ul id="failing-students" class="list"></ul>
          </article>
        </section>
      </main>
    </div>
  </div>

  <!-- ================================
  EPIC 9: Storage Service Layer
  EPIC 10: Validation & Error Handling
  ================================ -->
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
