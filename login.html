<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | School Management System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
</head>
<body data-page="login">
  <!-- ================================
  EPIC 2: Authentication
  TASK 2.1: Create login form
  ================================ -->
  <main class="auth-page">
    <section class="auth-card">
      <h1>Admin Login</h1>
      <p>Use default account: admin@sms.com / 123456</p>

      <div id="auth-alert"></div>

      <form id="login-form" class="app-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="admin@sms.com" required />
          <small class="error-text" data-error-for="email"></small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="123456" required />
          <small class="error-text" data-error-for="password"></small>
        </div>

        <button class="btn btn-primary" type="submit">Login</button>
      </form>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
