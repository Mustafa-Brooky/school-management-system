<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classes | School Management System</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body data-page="classes" data-protected="true">
  <!-- ================================
  EPIC 1: UI & Layout
  TASK 1.1: Create full responsive layout
  TASK 1.2: Create sidebar navigation
  TASK 1.3: Create top navbar
  ================================ -->
  <div class="layout">
    <aside id="sidebar"></aside>
    <div class="main-wrapper">
      <header id="topbar"></header>
      
      <!-- ================================
      EPIC 5: Classes Management
      TASK 5.1: Create classes page
      TASK 5.2: Add class
      TASK 5.3: Edit class
      TASK 5.4: Delete class
      TASK 5.5: Assign students to class
      TASK 5.6: Count students per class
      ================================ -->
      <main class="content">
        <h1>Classes</h1>
        <div id="page-alert"></div>

        <section class="panel">
          <h2>Add / Edit Class</h2>
          <form id="classes-form" class="app-form" novalidate>
            <input type="hidden" id="class-id" />
            <div class="grid-2">
              <div class="form-group">
                <label for="class-name">Class Name</label>
                <input id="class-name" type="text" required />
                <small class="error-text" data-error-for="class-name"></small>
              </div>
              <div class="form-group">
                <label for="class-students">Assign Students</label>
                <select id="class-students" multiple></select>
              </div>
            </div>
            <button class="btn btn-primary" type="submit">Save Class</button>
            <button class="btn" type="button" id="classes-reset">Reset</button>
          </form>
        </section>

        <section class="panel">
          <h2>Class List</h2>
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Students Count</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="classes-table-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/classes.js"></script>
</body>
</html>
