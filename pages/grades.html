<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grades | School Management System</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body data-page="grades" data-protected="true">
  <!-- ================================
  EPIC 1: UI & Layout
  TASK 1.1: Create full responsive layout
  TASK 1.2: Create sidebar navigation
  TASK 1.3: Create top navbar
  ================================ -->
  <div class="layout">
    <aside id="sidebar"></aside>
    <div class="main-wrapper">
      <header id="topbar"></header>
      
      <!-- ================================
      EPIC 7: Grades System
      TASK 7.1: Create grades page
      TASK 7.2: Add grade
      TASK 7.3: Edit grade
      TASK 7.4: Delete grade
      TASK 7.5: Validate grade (0-100)
      TASK 7.6: Prevent duplicate grade per student/subject
      TASK 7.7: Calculate student average
      TASK 7.8: Display pass/fail status
      TASK 7.9: Filter grades by class
      ================================ -->
      <main class="content">
        <h1>Grades</h1>
        <div id="page-alert"></div>

        <section class="panel">
          <h2>Add / Edit Grade</h2>
          <form id="grades-form" class="app-form" novalidate>
            <input type="hidden" id="grade-id" />
            <div class="grid-3">
              <div class="form-group">
                <label for="grade-student">Student</label>
                <select id="grade-student" required></select>
                <small class="error-text" data-error-for="grade-student"></small>
              </div>
              <div class="form-group">
                <label for="grade-subject">Subject</label>
                <select id="grade-subject" required></select>
                <small class="error-text" data-error-for="grade-subject"></small>
              </div>
              <div class="form-group">
                <label for="grade-value">Grade</label>
                <input id="grade-value" type="number" min="0" max="100" required />
                <small class="error-text" data-error-for="grade-value"></small>
              </div>
            </div>
            <button class="btn btn-primary" type="submit">Save Grade</button>
            <button class="btn" type="button" id="grades-reset">Reset</button>
          </form>
        </section>

        <section class="panel">
          <h2>Grade List</h2>
          <div class="table-toolbar">
            <select id="grades-class-filter"></select>
            <button class="btn" id="show-report" type="button">Show Student Report</button>
          </div>
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Subject</th>
                  <th>Grade</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="grades-table-body"></tbody>
            </table>
          </div>
        </section>

        <section class="panel" id="student-report-panel">
          <h2>Student Report</h2>
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Average</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="report-table-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/grades.js"></script>
</body>
</html>
