<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students | School Management System</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body data-page="students" data-protected="true">
  <!-- ================================
  EPIC 1: UI & Layout
  TASK 1.1: Create full responsive layout
  TASK 1.2: Create sidebar navigation
  TASK 1.3: Create top navbar
  ================================ -->
  <div class="layout">
    <aside id="sidebar"></aside>
    <div class="main-wrapper">
      <header id="topbar"></header>
      
      <!-- ================================
      EPIC 3: Student Management
      TASK 3.1: Create students page
      TASK 3.2: Add student
      TASK 3.3: Edit student
      TASK 3.4: Delete student
      TASK 3.5: Search student
      TASK 3.6: Filter by class
      ================================ -->
      <main class="content">
        <h1>Students</h1>
        <div id="page-alert"></div>

        <section class="panel">
          <h2>Add / Edit Student</h2>
          <form id="students-form" class="app-form" novalidate>
            <input type="hidden" id="student-id" />
            <div class="grid-3">
              <div class="form-group">
                <label for="student-name">Name</label>
                <input id="student-name" type="text" required />
                <small class="error-text" data-error-for="student-name"></small>
              </div>
              <div class="form-group">
                <label for="student-age">Age</label>
                <input id="student-age" type="number" min="5" max="25" required />
                <small class="error-text" data-error-for="student-age"></small>
              </div>
              <div class="form-group">
                <label for="student-class">Class</label>
                <select id="student-class" required></select>
                <small class="error-text" data-error-for="student-class"></small>
              </div>
            </div>
            <button class="btn btn-primary" type="submit">Save Student</button>
            <button class="btn" type="button" id="students-reset">Reset</button>
          </form>
        </section>

        <section class="panel">
          <h2>Student List</h2>
          <div class="table-toolbar">
            <input id="student-search" type="search" placeholder="Search by name" />
            <select id="student-class-filter"></select>
          </div>
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Age</th>
                  <th>Class</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="students-table-body"></tbody>
            </table>
          </div>
          <div id="students-empty"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/students.js"></script>
</body>
</html>
